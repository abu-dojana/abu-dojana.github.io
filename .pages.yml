media:
  - name: images
    label: Images
    input: public/images
    output: /images
    extensions:
      - jpg
      - jpeg
      - png
      - webp
      - gif
      - avif
      - svg
    rename: safe
components:
  record-id:
    type: uuid
    label: Record ID
    description: Generated automatically. Keep this unchanged so links and saved CV selections continue working.
    options:
      editable: false
      generate: false
  slug:
    type: string
    label: URL name
    required: true
    description: Lowercase words separated by hyphens. Keep this unchanged after sharing a link.
    pattern:
      regex: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
      message: 'Use lowercase letters, numbers, and single hyphens between words.'
  link:
    type: object
    fields:
      - name: label
        type: string
        required: true
      - name: url
        type: string
        required: true
        description: 'A full https:// address or a path beginning with /.'
  menu-home:
    label: Home link
    type: object
    fields:
      - name: id
        component: record-id
      - name: label
        type: string
        required: true
        default: Home
      - name: visible
        type: boolean
        default: true
  menu-page:
    label: Page menu override
    type: object
    fields:
      - name: id
        component: record-id
      - name: label
        type: string
        required: true
        label: Fallback menu label
        description: Used only when the page has no short menu label of its own.
      - name: target
        label: Page
        type: reference
        required: true
        options:
          collection: pages
          value: '{fields.id}'
          label: '{fields.title}'
      - name: visible
        type: boolean
        default: true
    description: Optional existing-page label or visibility override. Deleted-page overrides are ignored. Page ordering is controlled in the page form.
  menu-cv:
    label: CV link
    type: object
    fields:
      - name: id
        component: record-id
      - name: label
        type: string
        required: true
        default: CV
      - name: visible
        type: boolean
        default: true
  menu-external:
    label: External link
    type: object
    fields:
      - name: id
        component: record-id
      - name: label
        type: string
        required: true
      - name: target
        label: Destination URL
        type: string
        required: true
        description: 'A complete https:// address.'
      - name: visible
        type: boolean
        default: true
  page-item:
    type: object
    fields:
      - name: id
        component: record-id
      - name: title
        label: Item title
        type: string
        required: true
      - name: slug
        component: slug
        label: Custom item URL name
        required: false
        description: >-
          Optional. Leave blank for a stable automatic address. A custom value must be unique across all pages
          and use lowercase words separated by hyphens.
        pattern:
          regex: '^$|^[a-z0-9]+(?:-[a-z0-9]+)*$'
          message: 'Leave blank or use lowercase letters, numbers, and single hyphens between words.'
      - name: summary
        label: Short description
        type: text
        required: false
        description: Optional. A skill or hobby can be just a title; add detail when it helps.
      - name: published
        label: Publish this item
        type: boolean
        default: false
        description: The parent page must also be published. Draft files are still readable in the public repository.
      - name: example
        label: This is example content
        type: boolean
        default: false
        description: >-
          Examples are labeled and excluded from the real CV. A page marked as example also marks all of its
          items as examples.
      - name: tags
        label: Tags
        type: string
        list: true
      - name: date
        label: Publication or start date
        type: string
        description: 'Optional. Use YYYY-MM-DD, for example 2026-10-29.'
        pattern: '^$|^\d{4}-\d{2}-\d{2}$'
      - name: endDate
        label: End date
        type: string
        description: Optional. Use YYYY-MM-DD.
        pattern: '^$|^\d{4}-\d{2}-\d{2}$'
      - name: progress
        label: Progress
        type: select
        options:
          values:
            - name: ''
              label: Not applicable
            - name: planned
              label: Planned
            - name: in-progress
              label: In progress
            - name: completed
              label: Completed
      - name: cover
        label: Cover image
        type: image
        options:
          media: images
      - name: coverAlt
        label: Image description
        type: string
        description: Describe the image for someone who cannot see it.
      - name: details
        label: Additional details
        type: object
        list: true
        description: 'Add any labeled information, such as a role, location, organization, or equipment type.'
        fields:
          - name: label
            type: string
            required: true
          - name: value
            type: string
            required: true
      - name: links
        label: Supporting links
        component: link
        list: true
      - name: body
        label: Details
        type: rich-text
        options:
          format: markdown
          media: images
          switcher: true
        description: 'Optional longer text, pictures, code, or a full story for this item.'
      - name: cv
        label: CV version
        type: object
        description: Optional concise CV presentation. The page name does not determine the CV section.
        fields:
          - name: include
            label: Offer this item in the CV builder
            type: boolean
            default: false
          - name: section
            label: CV section
            type: reference
            options:
              collection: cv-sections
              value: '{fields.id}'
              label: '{fields.title}'
          - name: title
            label: CV title
            type: string
            description: Leave blank to use the item title.
          - name: subtitle
            label: 'Role, organization, or subtitle'
            type: string
          - name: date
            label: CV date or date range
            type: string
            description: For example September 2025 – Present. Keep planned qualifications accurately labeled.
          - name: bullets
            label: Concise CV bullets
            type: string
            list: true
          - name: order
            label: Default position within its section
            type: number
            default: 0
content:
  - name: about
    label: About
    type: file
    path: content/about.md
    format: yaml-frontmatter
    operations:
      rename: false
      delete: false
    fields:
      - name: title
        label: Page heading
        type: string
        required: true
      - name: summary
        label: Short introduction
        type: text
      - name: navigationLabel
        label: Short menu label
        type: string
        default: About
        description: Optional. Leave blank to use About. The page and its menu link are permanent.
      - name: example
        label: This is example content
        type: boolean
        default: false
        description: Marks this introduction and any items as examples. Turn off after replacing the starter with your own content.
      - name: body
        label: About you
        type: rich-text
        options:
          format: markdown
          media: images
        description: Your introduction, pictures, and anything else you want visitors to know about you.
      - name: items
        label: Items
        component: page-item
        list:
          collapsible:
            collapsed: true
            summary: '{fields.title}'
        description: Optional additional items shown in About's left-hand list. About itself is always published; each item has its own publishing switch.
  - name: pages
    label: Pages
    type: collection
    path: content/pages
    format: yaml-frontmatter
    filename: '{fields.slug}.md'
    view:
      primary: title
      fields:
        - title
        - navigationLabel
        - published
        - order
      sort:
        - order
        - title
      default:
        sort: order
        order: asc
    fields:
      - name: id
        component: record-id
      - name: title
        label: Page name
        type: string
        required: true
      - name: slug
        component: slug
      - name: summary
        label: Short description
        type: text
      - name: published
        label: Publish on the website
        type: boolean
        default: false
      - name: example
        label: This is example content
        type: boolean
        default: false
        description: 'Marks the page and all of its items as examples, including in CV demos.'
      - name: showInNavigation
        label: Show this page in the menu
        type: boolean
        default: true
        description: Published pages appear automatically. Additional links appear under More when needed. No separate menu setup is needed.
      - name: navigationLabel
        label: Short menu label
        type: string
        description: Optional. Leave blank to use the page name.
      - name: order
        label: Page position
        type: number
        default: 0
        description: Lower numbers come first in the menu and page lists.
      - name: body
        label: Page introduction
        type: rich-text
        options:
          format: markdown
          media: images
        description: Optional introduction shown in the main reading area when the page opens.
      - name: items
        label: Items
        component: page-item
        list:
          collapsible:
            collapsed: true
            summary: '{fields.title}'
        description: Add and edit the things that belong on this page. They appear in its left-hand item list in this order; selecting one opens its details in the main reading area.
  - name: site
    label: Profile & website settings
    type: file
    path: content/site.json
    format: json
    fields:
      - name: siteTitle
        label: Website name
        type: string
        required: true
      - name: name
        label: Your name for the CV
        type: string
      - name: headline
        label: Professional headline
        type: string
      - name: bio
        label: Short introduction / CV summary
        type: text
      - name: email
        label: Public email
        type: string
        description: Leave blank if you do not want it in the public repository or website.
      - name: location
        label: Public location
        type: string
        description: Optional city or country. Do not enter a private address.
      - name: links
        label: Public profile links
        component: link
        list: true
      - name: skills
        label: Skills you can demonstrate
        type: string
        list: true
      - name: homeEyebrow
        label: Homepage small heading
        type: string
      - name: homeTitle
        label: Homepage title
        type: text
      - name: homeDescription
        label: Homepage introduction
        type: text
      - name: footerNote
        label: Footer note
        type: string
      - name: preview
        label: Preview mode
        type: boolean
        default: true
        description: >-
          Shows a starter notice and asks search engines not to index the site. Turn off after adding real
          content.
      - name: navigation
        label: Optional extra navigation links
        type: block
        list: true
        blockKey: type
        description: >-
          Normal pages appear automatically. Use this list for Home, CV, and external links. Existing-page
          overrides affect fallback labels or visibility, not page order. Overrides for deleted pages are ignored.
          About has its own permanent link, edited in the About form.
        blocks:
          - name: home
            label: Home
            component: menu-home
          - name: page
            label: Existing page override
            component: menu-page
          - name: cv
            label: CV
            component: menu-cv
          - name: external
            label: External website
            component: menu-external
  - name: cv-sections
    label: CV sections
    type: collection
    path: content/cv-sections
    format: json
    filename: '{fields.id}.json'
    view:
      primary: title
    fields:
      - name: id
        component: record-id
      - name: title
        label: Section heading
        type: string
        required: true
      - name: order
        label: Default section position
        type: number
        default: 0
