media:
  - name: images
    label: Images
    input: public/images
    output: /images
    extensions:
      - jpg
      - jpeg
      - png
      - webp
      - gif
      - avif
      - svg
    rename: safe
  - name: documents
    label: Documents & PDFs
    input: public/files
    output: /files
    extensions:
      - pdf
      - doc
      - docx
      - ppt
      - pptx
      - zip
    rename: safe

components:
  link:
    type: object
    fields:
      - name: label
        label: Link label
        type: string
        required: true
      - name: url
        label: URL
        type: string
        required: true
        description: 'A full https:// address or a local path beginning with /.'
  detail:
    type: object
    fields:
      - name: label
        label: Label
        type: string
        required: true
      - name: value
        label: Value
        type: string
        required: true
  skill-group:
    type: object
    fields:
      - name: category
        label: Group name (e.g. Languages, Frameworks, Tools)
        type: string
        required: true
      - name: items
        label: Skills
        type: string
        list: true

content:
  - name: projects
    label: Projects
    type: collection
    path: content/projects
    format: yaml-frontmatter
    filename: '{primary}.md'
    view:
      primary: title
      fields:
        - title
        - status
        - featured
        - published
        - order
      sort:
        - order
        - startDate
        - title
      default:
        sort: order
        order: asc
    fields:
      - name: title
        label: Project title
        type: string
        required: true
      - name: slug
        label: Custom URL slug (optional)
        type: string
        required: false
        description: >-
          Leave blank to use the filename automatically. Use lowercase letters,
          numbers, and hyphens.
        pattern:
          regex: '^$|^[a-z0-9]+(?:-[a-z0-9]+)*$'
          message: Leave blank or use lowercase letters, numbers, and single hyphens between words.
      - name: summary
        label: Short summary
        type: text
        required: false
        description: 1–3 sentences shown on project cards and at the top of the project page.
      - name: images
        label: Project images / screenshots
        type: image
        description: >-
          Upload or select one or more images. Drag to reorder; the first image
          is used as the cover thumbnail.
        options:
          media: images
          path: public/images/projects
          multiple: true
          unique: true
      - name: files
        label: PDFs & documents (papers, slides, reports)
        type: file
        description: >-
          Upload one or more PDFs or documents (e.g. research paper, slides, or
          specification). PDFs automatically get a Read PDF button and an inline
          preview on the page.
        options:
          media: documents
          multiple: true
          unique: true
      - name: role
        label: Your role
        type: string
        description: e.g. Creator, Lead Developer, Backend Engineer
      - name: tech
        label: Tech stack / technologies
        type: string
        list: true
        description: e.g. TypeScript, React, IndexedDB, Chrome Extensions API
      - name: liveUrl
        label: Live demo / Store URL
        type: string
        description: Full https:// URL to the live app, Chrome Web Store, or deployment.
      - name: repoUrl
        label: Source code / GitHub URL
        type: string
        description: Full https:// URL to the repository.
      - name: links
        label: Additional links
        component: link
        list: true
      - name: status
        label: Status
        type: select
        default: completed
        options:
          values:
            - name: ''
              label: Not specified
            - name: planned
              label: Planned
            - name: in-progress
              label: In progress
            - name: completed
              label: Completed
            - name: archived
              label: Archived
      - name: startDate
        label: Start date
        type: date
        options:
          format: yyyy-MM-dd
      - name: endDate
        label: End date
        type: date
        options:
          format: yyyy-MM-dd
      - name: highlights
        label: Key highlights & achievements (also used as CV bullet points)
        type: string
        list: true
        description: Concise bullet points describing what you built and its impact.
      - name: tags
        label: Tags
        type: string
        list: true
      - name: body
        label: Full project write-up
        type: rich-text
        description: >-
          Write your full content here. To add an image between paragraphs,
          place your cursor on a new line between paragraphs and click the Image
          icon in the toolbar (or switch to Markdown mode and write
          ![Caption](/images/your-image.png)).
        options:
          format: markdown
          media: images
          switcher: true
      - name: featured
        label: Feature on homepage
        type: boolean
        default: true
      - name: showOnCv
        label: Include on CV
        type: boolean
        default: true
      - name: order
        label: Display order (lower numbers appear first)
        type: number
        default: 0
      - name: published
        label: Published
        type: boolean
        default: true

  - name: experience
    label: Experience
    type: collection
    path: content/experience
    format: yaml-frontmatter
    filename: '{primary}.md'
    view:
      primary: title
      fields:
        - title
        - organization
        - startDate
        - current
        - published
      sort:
        - order
        - startDate
        - title
      default:
        sort: order
        order: asc
    fields:
      - name: title
        label: Role / Job title
        type: string
        required: true
      - name: organization
        label: Company / Organization
        type: string
        required: true
      - name: organizationUrl
        label: Organization website (optional)
        type: string
      - name: employmentType
        label: Type
        type: select
        options:
          values:
            - name: ''
              label: Not specified
            - name: Full-time
              label: Full-time
            - name: Part-time
              label: Part-time
            - name: Internship
              label: Internship
            - name: Contract
              label: Contract
            - name: Freelance
              label: Freelance
            - name: Research
              label: Research
            - name: Volunteer
              label: Volunteer
      - name: location
        label: Location
        type: string
        description: e.g. Dhaka, Bangladesh or Remote
      - name: startDate
        label: Start date
        type: date
        options:
          format: yyyy-MM-dd
      - name: endDate
        label: End date
        type: date
        description: Leave blank if this is your current role.
        options:
          format: yyyy-MM-dd
      - name: current
        label: I currently work here
        type: boolean
        default: false
      - name: summary
        label: Short overview
        type: text
      - name: highlights
        label: Responsibilities & achievements (shown on page and CV)
        type: string
        list: true
      - name: tech
        label: Technologies / skills used
        type: string
        list: true
      - name: images
        label: Images (optional)
        type: image
        options:
          media: images
          multiple: true
          unique: true
      - name: files
        label: PDFs & documents (optional)
        type: file
        description: Upload supporting PDFs or documents (e.g. publications, certificates, or letters).
        options:
          media: documents
          multiple: true
          unique: true
      - name: links
        label: Supporting links
        component: link
        list: true
      - name: body
        label: Additional details
        type: rich-text
        description: >-
          To add an image between paragraphs, place your cursor on a new line
          between paragraphs and click the Image icon in the toolbar (or switch
          to Markdown mode and write ![Caption](/images/your-image.png)).
        options:
          format: markdown
          media: images
          switcher: true
      - name: showOnCv
        label: Include on CV
        type: boolean
        default: true
      - name: order
        label: Display order
        type: number
        default: 0
      - name: published
        label: Published
        type: boolean
        default: true

  - name: education
    label: Education
    type: collection
    path: content/education
    format: yaml-frontmatter
    filename: '{primary}.md'
    view:
      primary: degree
      fields:
        - degree
        - institution
        - startDate
        - endDate
        - published
      sort:
        - order
        - startDate
      default:
        sort: order
        order: asc
    fields:
      - name: degree
        label: Degree / Qualification
        type: string
        required: true
        description: e.g. B.Sc. in Computer Science & Engineering
      - name: institution
        label: Institution / University
        type: string
        required: true
      - name: institutionUrl
        label: Institution website (optional)
        type: string
      - name: field
        label: Field of study / Major
        type: string
      - name: location
        label: Location
        type: string
      - name: startDate
        label: Start date
        type: date
        options:
          format: yyyy-MM-dd
      - name: endDate
        label: End or expected graduation date
        type: date
        options:
          format: yyyy-MM-dd
      - name: current
        label: Currently studying here
        type: boolean
        default: false
      - name: grade
        label: Grade / GPA / Honors (optional)
        type: string
      - name: summary
        label: Summary
        type: text
      - name: highlights
        label: Coursework, thesis, awards, or activities
        type: string
        list: true
      - name: images
        label: Images (optional)
        type: image
        options:
          media: images
          multiple: true
          unique: true
      - name: files
        label: PDFs & documents (thesis, certificates, transcripts)
        type: file
        description: Upload your thesis PDF, certificates, or academic documents.
        options:
          media: documents
          multiple: true
          unique: true
      - name: links
        label: Links (certificates, thesis, etc.)
        component: link
        list: true
      - name: body
        label: Additional details
        type: rich-text
        description: >-
          To add an image between paragraphs, place your cursor on a new line
          between paragraphs and click the Image icon in the toolbar (or switch
          to Markdown mode and write ![Caption](/images/your-image.png)).
        options:
          format: markdown
          media: images
          switcher: true
      - name: showOnCv
        label: Include on CV
        type: boolean
        default: true
      - name: order
        label: Display order
        type: number
        default: 0
      - name: published
        label: Published
        type: boolean
        default: true

  - name: research
    label: Research
    description: Research papers, publications, preprints, and academic projects.
    type: collection
    path: content/research
    format: yaml-frontmatter
    filename: '{primary}.md'
    view:
      primary: title
      fields:
        - title
        - subtitle
        - date
        - showOnCv
        - published
      sort:
        - order
        - date
        - title
      default:
        sort: order
        order: asc
    fields:
      - name: title
        label: Paper / Research title
        type: string
        required: true
      - name: slug
        label: Custom URL slug (optional)
        type: string
        required: false
        description: Leave blank to use the filename automatically.
        pattern:
          regex: '^$|^[a-z0-9]+(?:-[a-z0-9]+)*$'
          message: Leave blank or use lowercase letters, numbers, and single hyphens between words.
      - name: subtitle
        label: Authors / Venue / Journal (optional)
        type: string
        description: e.g. First Author · IEEE Access or Conference name
      - name: summary
        label: Abstract / Short summary
        type: text
      - name: files
        label: Paper PDF & slides
        type: file
        description: >-
          Upload your paper PDF, presentation slides, or supplementary documents.
          Uploaded PDFs automatically display a Read PDF button and an inline
          reader on the page.
        options:
          media: documents
          multiple: true
          unique: true
      - name: images
        label: Figures / Diagrams (optional)
        type: image
        options:
          media: images
          multiple: true
          unique: true
      - name: date
        label: Publication / Preprint date
        type: date
        options:
          format: yyyy-MM-dd
      - name: endDate
        label: End date (optional)
        type: date
        options:
          format: yyyy-MM-dd
      - name: tags
        label: Keywords / Topics
        type: string
        list: true
      - name: details
        label: Publication details (e.g. Venue, DOI, Status, Accuracy)
        component: detail
        list: true
      - name: links
        label: External links (DOI, IEEE, arXiv, Code, Dataset)
        component: link
        list: true
      - name: highlights
        label: Key contributions / CV bullet points (optional)
        type: string
        list: true
      - name: body
        label: Full write-up
        type: rich-text
        description: >-
          Write your full content here. To add an image between paragraphs,
          place your cursor on a new line between paragraphs and click the Image
          icon in the toolbar (or switch to Markdown mode and write
          ![Caption](/images/your-image.png)).
        options:
          format: markdown
          media: images
          switcher: true
      - name: showOnCv
        label: Include on CV
        type: boolean
        default: true
      - name: order
        label: Display order
        type: number
        default: 0
      - name: published
        label: Published
        type: boolean
        default: true

  - name: items
    label: Custom section items
    description: Add entries to any other custom section you create (such as Blog, Awards, or Anime).
    type: collection
    path: content/items
    format: yaml-frontmatter
    filename: '{primary}.md'
    view:
      primary: title
      fields:
        - title
        - section
        - date
        - published
      sort:
        - order
        - date
        - title
      default:
        sort: order
        order: asc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: slug
        label: Custom URL slug (optional)
        type: string
        required: false
        description: Leave blank to use the filename automatically.
        pattern:
          regex: '^$|^[a-z0-9]+(?:-[a-z0-9]+)*$'
          message: Leave blank or use lowercase letters, numbers, and single hyphens between words.
      - name: section
        label: Section
        type: reference
        required: true
        description: Choose which section this item belongs to.
        options:
          collection: sections
          value: '{fields.slug}'
          label: '{fields.title}'
      - name: summary
        label: Short description
        type: text
      - name: images
        label: Images
        type: image
        options:
          media: images
          multiple: true
          unique: true
      - name: files
        label: PDFs & documents (e.g. research paper PDF, slides)
        type: file
        description: >-
          Upload one or more PDFs or documents (such as your paper PDF or
          presentation slides). Uploaded PDFs are shown with a Read PDF button
          and an inline reader on the item page.
        options:
          media: documents
          multiple: true
          unique: true
      - name: subtitle
        label: Subtitle / Role / Source (optional)
        type: string
      - name: date
        label: Date
        type: date
        options:
          format: yyyy-MM-dd
      - name: endDate
        label: End date (optional)
        type: date
        options:
          format: yyyy-MM-dd
      - name: tags
        label: Tags
        type: string
        list: true
      - name: details
        label: Labeled details (e.g. Rating, Platform, Venue)
        component: detail
        list: true
      - name: links
        label: Links
        component: link
        list: true
      - name: highlights
        label: Key points / CV bullets (optional)
        type: string
        list: true
      - name: body
        label: Full content
        type: rich-text
        description: >-
          Write your full content here. To add an image between paragraphs,
          place your cursor on a new line between paragraphs and click the Image
          icon in the toolbar (or switch to Markdown mode and write
          ![Caption](/images/your-image.png)).
        options:
          format: markdown
          media: images
          switcher: true
      - name: showOnCv
        label: Include on CV
        type: boolean
        default: false
      - name: order
        label: Display order
        type: number
        default: 0
      - name: published
        label: Published
        type: boolean
        default: true

  - name: sections
    label: Sections & Menu Tabs
    type: collection
    path: content/sections
    format: yaml-frontmatter
    filename: '{fields.slug}.md'
    view:
      primary: title
      fields:
        - title
        - slug
        - type
        - published
        - showInNavigation
        - order
      sort:
        - order
        - title
      default:
        sort: order
        order: asc
    fields:
      - name: title
        label: Section title
        type: string
        required: true
      - name: slug
        label: URL slug
        type: string
        required: true
        pattern:
          regex: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          message: Use lowercase letters, numbers, and hyphens.
      - name: type
        label: Section type
        type: select
        required: true
        default: general
        description: >-
          Built-in types display your Projects, Experience, Education, or Skills
          automatically. Choose Custom section for any other topic (Blog,
          Research, Anime, etc.).
        options:
          values:
            - name: general
              label: Custom section (uses Custom section items)
            - name: projects
              label: Projects (displays Projects collection)
            - name: experience
              label: Experience (displays Experience collection)
            - name: education
              label: Education (displays Education collection)
            - name: skills
              label: Skills (displays Skills from Profile settings)
      - name: summary
        label: Short description
        type: text
      - name: published
        label: Published (uncheck to hide this section completely)
        type: boolean
        default: true
      - name: showInNavigation
        label: Show tab in top navigation menu
        type: boolean
        default: true
        description: Overflow tabs automatically appear under More.
      - name: navigationLabel
        label: Short menu tab label (optional)
        type: string
        description: Leave blank to use the section title.
      - name: order
        label: Menu tab position (lower numbers come first)
        type: number
        default: 10
      - name: body
        label: Section introduction (optional)
        type: rich-text
        description: >-
          To add an image between paragraphs, place your cursor on a new line
          between paragraphs and click the Image icon in the toolbar.
        options:
          format: markdown
          media: images
          switcher: true

  - name: about
    label: About
    type: file
    path: content/about.md
    format: yaml-frontmatter
    operations:
      rename: false
      delete: false
    fields:
      - name: title
        label: Heading
        type: string
        required: true
        default: About
      - name: summary
        label: Short introduction
        type: text
      - name: published
        label: Show About page on the website
        type: boolean
        default: true
      - name: showInNavigation
        label: Show About in the menu
        type: boolean
        default: true
      - name: navigationLabel
        label: Menu label
        type: string
        default: About
      - name: body
        label: About you
        type: rich-text
        description: >-
          To add an image between paragraphs, place your cursor on a new line
          between paragraphs and click the Image icon in the toolbar (or switch
          to Markdown mode and write ![Caption](/images/your-image.png)).
        options:
          format: markdown
          media: images
          switcher: true

  - name: site
    label: Profile & website settings
    type: file
    path: content/site.json
    format: json
    fields:
      - name: siteTitle
        label: Website title
        type: string
        required: true
      - name: name
        label: Full name (shown on homepage and CV)
        type: string
      - name: headline
        label: Professional headline
        type: string
        description: e.g. Software Engineer · Full-Stack & Browser Extensions
      - name: bio
        label: Professional summary / CV profile
        type: text
      - name: avatar
        label: Profile photo (optional)
        type: image
        options:
          media: images
      - name: email
        label: Public email
        type: string
      - name: phone
        label: Public phone (optional — shown on CV if provided)
        type: string
      - name: location
        label: Location (e.g. City, Country)
        type: string
      - name: links
        label: Profile links (GitHub, LinkedIn, etc.)
        component: link
        list: true
      - name: skillGroups
        label: Skills by category (shown on Skills page and CV)
        component: skill-group
        list: true
      - name: homeEyebrow
        label: Homepage small label
        type: string
      - name: homeTitle
        label: Homepage main heading
        type: text
      - name: homeDescription
        label: Homepage introduction
        type: text
      - name: footerNote
        label: Footer note (optional)
        type: string
      - name: showCvInNavigation
        label: Show CV link in top navigation
        type: boolean
        default: true
      - name: externalLinks
        label: Extra external navigation links (optional)
        component: link
        list: true
      - name: noindex
        label: Hide website from search engines (noindex)
        type: boolean
        default: false
